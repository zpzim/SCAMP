name: Benchmarks
on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [g++, clang++, cl, clang-cl]
        exclude:
          - os: ubuntu-latest
            compiler: cl
          - os: ubuntu-latest
            compiler: clang-cl
          - os: macos-latest
            compiler: cl
          - os: macos-latest
            compiler: clang-cl
          - os: windows-latest
            compiler: g++
          - os: windows-latest
            compiler: clang++


    name: CPU Benchmarks
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'true'
      - name: Prep Build
        run: echo "CXX=${{ matrix.compiler }}" >> $GITHUB_ENV
      - name: Build SCAMP Benchmarks
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          mkdir build && cd build
          if [ ${{ matrix.compiler }} = "clang-cl" ]; then
            cmake -G"Visual Studio 17 2022" -T ClangCL -A x64 -DBUILD_BENCHMARKS=1 .. 
          else
            cmake -DBUILD_BENCHMARKS=1 ..
          fi
          cmake --build . --config Release --parallel 2
          if [ -f "./src/benchmark/scamp_cpu_benchmarks" ]; then
            cp ./src/benchmark/scamp_cpu_benchmarks .
          fi
          if [ -f "./src/benchmark/Release/scamp_cpu_benchmarks.exe" ]; then
            cp ./src/benchmark/Release/scamp_cpu_benchmarks.exe .
          fi
      - name: Run Benchmarks
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE/build
          ./scamp_cpu_benchmarks --benchmark_format=json | tee benchmark_result.json

      # Run `github-action-benchmark` action
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          # What benchmark tool the output.txt came from
          tool: 'googlecpp'
          # Where the output from the benchmark tool is stored
          output-file-path: ./build/benchmark_result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Separate Dashboard for each combination of OS/Compiler
          benchmark-data-dir-path: cpu-benchmarks/${{ matrix.os }}/${{ matrix.compiler }}/bench
          auto-push: true
          fail-on-alert: false
          comment-on-alert: true
          alert-threshold: "200%"
          alert-comment-cc-users: '@zpzim'

  benchmark-stable:
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    name: CPU Benchmarks Stable
    # Fixed lightweight Cirun instance -> consistent hardware for the tight
    # regression threshold below (see .cirun.yml).
    runs-on: cirun-cpu-bench
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'true'
      - name: Install build tools
        # Plain Ubuntu AMI has no toolchain preinstalled.
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake git
      - name: Prep Build
        run: echo "CXX=${{ matrix.compiler }}" >> $GITHUB_ENV
      - name: Build SCAMP Benchmarks
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          mkdir build && cd build
          cmake -DBUILD_BENCHMARKS=1 ..
          cmake --build . --config Release --parallel 2
          if [ -f "./src/benchmark/scamp_cpu_benchmarks" ]; then
            cp ./src/benchmark/scamp_cpu_benchmarks .
          fi
      - name: Run Benchmarks
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE/build
          ./scamp_cpu_benchmarks --benchmark_format=json | tee benchmark_result.json
     
      # Run `github-action-benchmark` action
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          # What benchmark tool the output.txt came from
          tool: 'googlecpp'
          # Where the output from the benchmark tool is stored
          output-file-path: ./build/benchmark_result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Separate Dashboard for each combination of OS/Compiler.
          # Fresh series for the c6i runner; old path was self-hosted baselines.
          benchmark-data-dir-path: cpu-benchmarks/linux-c6i/${{ matrix.compiler }}/bench
          auto-push: true
          fail-on-alert: false
          comment-on-alert: true
          alert-threshold: "115%"
          alert-comment-cc-users: '@zpzim'

  benchmark-gpu:
    name: GPU Benchmarks
    # Ephemeral A10G (sm_86) spun up by Cirun (see .cirun.yml). A fixed
    # instance type gives run-to-run-consistent hardware, so the regression
    # tracking below stays meaningful even though the runner is ephemeral.
    runs-on: cirun-gpu-a10
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'true'
      - name: Verify GPU + CUDA toolchain
        shell: bash
        run: |
          set -e
          echo "/usr/local/cuda/bin" >> $GITHUB_PATH
          export PATH="/usr/local/cuda/bin:$PATH"
          nvidia-smi
          nvcc --version
      - name: Build SCAMP Benchmarks
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          mkdir build && cd build
          cmake -DFORCE_CUDA=1 -DBUILD_BENCHMARKS=1 ..
          cmake --build . --config Release --parallel 4
          if [ -f "./src/benchmark/scamp_gpu_benchmarks" ]; then
            cp ./src/benchmark/scamp_gpu_benchmarks .
          fi
      - name: Run Benchmarks
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE/build
          ./scamp_gpu_benchmarks --benchmark_format=json | tee benchmark_result.json

      # Run `github-action-benchmark` action
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          # What benchmark tool the output.txt came from
          tool: 'googlecpp'
          # Where the output from the benchmark tool is stored
          output-file-path: ./build/benchmark_result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Fresh series for the A10G runner; old path was P100 baselines.
          benchmark-data-dir-path: gpu-benchmarks/a10g/bench
          auto-push: true
          fail-on-alert: true
          comment-on-alert: true
          alert-threshold: "115%"
          alert-comment-cc-users: '@zpzim'
