name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build-and-test-cpu-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [g++, clang++, cl]
        redistributable: [OFF, ON]
        exclude:
          - os: ubuntu-latest
            compiler: cl
          - os: macos-latest
            compiler: cl
          - os: macos-latest
            compiler: g++
          - os: windows-latest
            compiler: g++
          - os: windows-latest
            compiler: clang++

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prep Build
        shell: bash
        run: |
          set -e
          echo "CXX=${{ matrix.compiler }}" >> $GITHUB_ENV
          echo "SCAMP_ENABLE_BINARY_DISTRIBUTION=${{ matrix.redistributable }}" >> $GITHUB_ENV

      - name: Build SCAMP
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          mkdir build && cd build
          cmake ..
          cmake --build . --config Release --parallel 2
          if [ -f "./Release/SCAMP.exe" ]; then
            cp ./Release/SCAMP.exe .
          fi

      - name: Basic Tests SCAMP
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE/test
          ./run_tests.sh ../build/SCAMP /dev/null "--no_gpu=true --num_cpu_workers=2"
          
      - name: Extended Tests SCAMP
        shell: bash
        run: |
          set -e
          python3 -m pip install numpy pandas tqdm
          cd $GITHUB_WORKSPACE/test
          python3 ./run_tests.py --executable "../build/SCAMP" --extra_args "--no_gpu --num_cpu_workers=2"
               

  build-and-test-arch-emulation:
    strategy:
      fail-fast: false
      matrix:
        # TODO(zpzim): Windows is disabled for now because it is flaky.
        #os: [ubuntu-latest, windows-latest]
        #compiler: [g++, clang++, cl]
        os: [ubuntu-latest]
        compiler: [g++, clang++]
        #exclude:
        #  - os: ubuntu-latest
        #    compiler: cl
        #  - os: windows-latest
        #    compiler: g++
        #  - os: windows-latest
        #    compiler: clang++
    
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Setup SDE binaries
        uses: petarpetrovt/setup-sde@v4.0
        with:
          sdeVersion: 9.33.0

      
      - name: Prep Build
        shell: bash
        run: |
          set -e
          echo "CXX=${{ matrix.compiler }}" >> $GITHUB_ENV
          echo "SCAMP_ENABLE_BINARY_DISTRIBUTION=ON" >> $GITHUB_ENV
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            SDE_PATH=`cygpath -u $SDE_PATH`
            echo $SDE_PATH
            echo "SDE_BINARY_PATH=${SDE_PATH}/sde.exe" >> $GITHUB_ENV
          else
            echo "SDE_BINARY_PATH=${SDE_PATH}/sde64" >> $GITHUB_ENV
          fi

      - name: Build SCAMP
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          mkdir build && cd build
          cmake ..
          cmake --build . --config Release --parallel 2
          if [ -f "./Release/SCAMP.exe" ]; then
            cp ./Release/SCAMP.exe .
          fi

      - name: Intel x86 Emulation Tests
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE/test
          ./run_intel_emulation_tests.sh "../build/SCAMP" ${SDE_BINARY_PATH}

  build-and-test-cpu-distributed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        compiler: [g++, clang++]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Prep Build
        run: |
          echo "CXX=${{ matrix.compiler }}" >> $GITHUB_ENV
          if [ "${{ matrix.compiler }}" = "g++" ]; then
            echo "CC=gcc" >> $GITHUB_ENV
          elif [ "${{ matrix.compiler }}" = "clang++" ]; then
            echo "CC=clang" >> $GITHUB_ENV
          fi
            
      - name: Build SCAMP Distributed
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          mkdir build && cd build
          cmake -DBUILD_CLIENT_SERVER=1 ..
          cmake --build . --config Release --parallel 2

      - name: Distributed Tests SCAMP
        shell: bash
        run: |
          set -e
          python3 -m pip install numpy pandas tqdm
          cd $GITHUB_WORKSPACE/test
          ../build/src/distributed/SCAMPserver &
          ../build/src/distributed/SCAMPclient &
          sleep 10
          ./run_tests.sh ../build/src/distributed/SCAMP_distributed /dev/null 
          python3 ./run_tests.py --executable ../build/src/distributed/SCAMP_distributed --matrix_sizes --window_sizes 100 --extra_args "--no_gpu --num_cpu_workers=1 --distributed_tile_size=1500"
    
  build-and-test-pyscamp:
    name: pyscamp ${{ matrix.os }} py${{ matrix.python-version }} np${{ matrix.numpy }} redistrib${{ matrix.redistributable }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
        numpy: ['1', '2']
        redistributable: ['OFF', 'ON']
        exclude:
          # numpy 1.x wheels do not exist for cp313 on PyPI
          - python-version: '3.13'
            numpy: '1'
          # Windows: only test the latest stable config (py3.13 + numpy2), both redistrib values
          - os: windows-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.12'
          - os: windows-latest
            numpy: '1'
          # Redistrib ON only tested with py3.13 to keep job count down
          - python-version: '3.10'
            redistributable: 'ON'
          - python-version: '3.12'
            redistributable: 'ON'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build pyscamp
        shell: bash
        run: |
          set -e
          echo "SCAMP_ENABLE_BINARY_DISTRIBUTION=${{ matrix.redistributable }}" >> $GITHUB_ENV
          python -m pip install --upgrade pip
          python -m pip install --upgrade "setuptools>=70" wheel setuptools_scm cmake
          if [ "${{ matrix.numpy }}" = "1" ]; then
            python -m pip install "numpy<2" pandas tqdm
          else
            python -m pip install "numpy>=2" pandas tqdm
          fi
          python -m pip install -v --no-build-isolation .

      - name: pyscamp tests
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE/test
          python test_pyscamp.py
          python ./run_tests.py --executable pyscamp

  build-cuda-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        compiler: [g++, clang++, cl]
        cuda: ['12.9.1']
        exclude:
          - os: ubuntu-latest
            compiler: cl
          - os: windows-latest
            compiler: g++
          - os: windows-latest
            compiler: clang++

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - uses: Jimver/cuda-toolkit@v0.2.30
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.cuda }}

      - name: Prep Build
        run: echo "CXX=${{ matrix.compiler }}" >> $GITHUB_ENV

      - name: Build SCAMP
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          mkdir build && cd build
          cmake -DFORCE_CUDA=1 ..
          cmake --build . --config Release --parallel 2

  build-cuda-versions:
    name: cuda-build ${{ matrix.cuda }} ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        cuda: ['12.6.0', '12.8.0', '13.0.0']
        compiler: [g++, cl]
        exclude:
          - os: ubuntu-latest
            compiler: cl
          - os: windows-latest
            compiler: g++

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - uses: Jimver/cuda-toolkit@v0.2.30
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.cuda }}

      - name: Prep Build
        run: echo "CXX=${{ matrix.compiler }}" >> $GITHUB_ENV

      - name: Build SCAMP
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          mkdir build && cd build
          cmake -DFORCE_CUDA=1 ..
          cmake --build . --config Release --parallel 2

  build-and-test-cuda:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Build SCAMP with CUDA
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          mkdir build && cd build
          cmake -DFORCE_CUDA=1 ..
          cmake --build . --config Release --parallel 2
          
      - name: Basic CUDA Tests SCAMP
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE/test
          ./run_tests.sh ../build/SCAMP /dev/null "--num_cpu_workers=0"
          
      - name: Extended Tests SCAMP
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE/test
          python3 ./run_tests.py --executable "../build/SCAMP" --force_gpu --extra_args " --num_cpu_workers=0"

